<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>サブトラ | 近日公開 事前登録</title>
<meta name="description" content="無料トライアルの終了日を、課金される前に通知。 Androidアプリ「サブトラ」の事前登録。">
<meta property="og:title" content="サブトラ — 無料トライアルの終了日を、課金される前に通知。">
<meta property="og:description" content="近日公開のAndroidアプリ。事前登録が多ければ優先してリリースします。">
<meta property="og:image" content="https://is-gts.github.io/subtra/og.png">
<meta property="og:url" content="https://is-gts.github.io/subtra/">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1a1d21;--muted:#5c6470;--line:#e3e6ea;--accent:#2563eb;--ok:#15803d}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--fg:#eceef1;--muted:#9aa3ad;--line:#2a2f37;--accent:#60a5fa;--ok:#4ade80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:560px;margin:0 auto;padding:48px 16px 64px}
.icon{font-size:64px;line-height:1;margin-bottom:12px}
h1{font-size:clamp(30px,7vw,42px);line-height:1.25;margin:0 0 8px}
.pitch{font-size:20px;font-weight:600;margin:0 0 20px}
ul{margin:0 0 28px;padding-left:20px;color:var(--muted)}
.badge{display:inline-block;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin-bottom:16px}
form{display:flex;gap:8px}
input[type=email]{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font-size:16px}
button{padding:12px 18px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;font-size:16px;cursor:pointer;white-space:nowrap}
button:disabled{opacity:.6;cursor:default}
.msg{font-size:14px;min-height:1.4em;margin:8px 0 0}
.msg.ok{color:var(--ok)}
.hp{position:absolute;left:-9999px}
footer{margin-top:40px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
<div class="icon">💳</div>
<span class="badge">Android · 近日公開</span>
<h1>サブトラ</h1>
<p class="pitch">無料トライアルの終了日を、課金される前に通知。</p>
<ul><li>サブスク一覧と月額合計を一画面で</li><li>トライアル終了・更新日の前日にアラート</li><li>解約手順へのリンク付き</li></ul>
<form><input type="email" name="email" placeholder="メールアドレス" required autocomplete="email"><input class="hp" name="hp" tabindex="-1" autocomplete="off"><button>事前登録</button></form>
<p class="msg"></p>
<footer>登録は無料。公開時にメールで1通だけお知らせします。メールアドレスはリリース通知のみに使用し、第三者には提供しません。</footer>
</main>
<script>
const ENDPOINT = "https://script.google.com/macros/s/AKfycbyzV1WIYIxnYVrx0GkV5e0CbnglA2Yu3JSZlw0mKB-JGQSZEI5FeUPZIB5cYhRjBg8wOw/exec";
const APP = "subtra", KEY = "preregistered-" + APP;
const form = document.querySelector("form"), msg = document.querySelector(".msg");
const mark = () => { form.querySelector("button").disabled = true; form.querySelector("input[type=email]").disabled = true; msg.textContent = "登録済みです。公開時にお知らせします。"; msg.className = "msg ok"; };
if (localStorage.getItem(KEY)) mark();
form.addEventListener("submit", async e => {
  e.preventDefault();
  const fd = new FormData(form);
  fd.append("app", APP); fd.append("ref", document.referrer); fd.append("ua", navigator.userAgent);
  form.querySelector("button").disabled = true; msg.className = "msg"; msg.textContent = "送信中…";
  try {
    await fetch(ENDPOINT, { method: "POST", mode: "no-cors", body: fd });
    localStorage.setItem(KEY, "1"); mark();
  } catch {
    form.querySelector("button").disabled = false; msg.textContent = "送信に失敗しました。もう一度お試しください。";
  }
});
</script>
</body>
</html>
